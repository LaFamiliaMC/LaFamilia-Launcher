name: Test La Familia automatische HTTPS-Metriken

on:
  push:
    branches:
      - fix/automatic-https-server-metrics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test Launcher and automatic server metrics
        run: npm test
