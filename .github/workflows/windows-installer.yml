name: La Familia Windows Setup

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Offizielles GitHub Release dieser Version erstellen?'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'data/news.json'
      - 'assets/news/**'
      - 'NEWS-ANLEITUNG.md'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      LA_FAMILIA_UPDATES_OWNER: ${{ vars.LA_FAMILIA_UPDATES_OWNER || github.repository_owner }}
      LA_FAMILIA_UPDATES_REPO: ${{ vars.LA_FAMILIA_UPDATES_REPO || github.event.repository.name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax check
        run: npm run check

      - name: Updater unit tests
        run: npm test

      - name: Build LaFamilia-Setup.exe
        run: npm run dist:win

      - name: Installer and update metadata as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaFamilia-Windows-Setup-${{ github.run_number }}
          path: |
            dist/LaFamilia-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

      # Release bei vX.Y.Z-Tags oder bei bewusst aktiviertem manuellen Release.
      # Der normale Push-Build und 'Run workflow' mit false veröffentlichen NICHTS.
      - name: Publish official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          SEPARATE_RELEASE_TOKEN: ${{ secrets.LA_FAMILIA_RELEASES_TOKEN }}
        run: |
          if (-not $env:LA_FAMILIA_UPDATES_OWNER -or -not $env:LA_FAMILIA_UPDATES_REPO) {
            throw 'Repo-Angaben für Updates fehlen. Keine Veröffentlichung.'
          }
          $targetRepo = "$env:LA_FAMILIA_UPDATES_OWNER/$env:LA_FAMILIA_UPDATES_REPO"
          if ($targetRepo -eq $env:GITHUB_REPOSITORY) {
            $env:GH_TOKEN = $env:SOURCE_GITHUB_TOKEN
          } elseif ($env:SEPARATE_RELEASE_TOKEN) {
            $env:GH_TOKEN = $env:SEPARATE_RELEASE_TOKEN
          } else {
            throw 'Für ein separates Update-Repo fehlt das Secret LA_FAMILIA_RELEASES_TOKEN.'
          }
          $actualVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$actualVersion"
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw 'Offizielle Releases nur von main veröffentlichen.'
            }
            if ($targetRepo -ne $env:GITHUB_REPOSITORY) {
              throw 'Manuelle Releases sind momentan nur im selben Repository erlaubt.'
            }
          } elseif ($env:GITHUB_REF -ne "refs/tags/$tag") {
            throw "Tag $env:GITHUB_REF stimmt nicht mit package.json $tag überein."
          }
          gh release view $tag --repo $targetRepo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag existiert bereits – kein Überschreiben."
          }
          $assets = @(Get-ChildItem dist -File | Where-Object {
            $_.Name -match '^LaFamilia-Setup-.*\.exe$' -or
            $_.Name -eq 'latest.yml' -or
            $_.Name -like '*.blockmap'
          } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 2 -or -not (Test-Path 'dist/latest.yml')) {
            throw 'Update-Metadaten/Setup fehlen. Kein Release ohne latest.yml.'
          }
          gh release create $tag @assets --repo $targetRepo --target $env:GITHUB_SHA --title "La Familia $actualVersion" --notes "La Familia Launcher Windows Setup $actualVersion" --latest
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release $tag konnte nicht erstellt werden."
          }
