name: La Familia Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/news.json'
      - 'assets/news/**'
      - 'NEWS-ANLEITUNG.md'

concurrency:
  group: la-familia-windows-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      LA_FAMILIA_UPDATES_OWNER: ${{ vars.LA_FAMILIA_UPDATES_OWNER || github.repository_owner }}
      LA_FAMILIA_UPDATES_REPO: ${{ vars.LA_FAMILIA_UPDATES_REPO || github.event.repository.name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set unique version for this test update
        run: node scripts/set-ci-version.cjs

      - name: JavaScript syntax check
        run: npm run check

      - name: Updater unit tests
        run: npm test

      - name: Build LaFamilia-Setup.exe
        run: npm run dist:win

      - name: Verify setup and update manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path 'dist/latest.yml')) { throw 'latest.yml fehlt.' }
          $metadata = Get-Content dist/latest.yml -Raw
          if (-not $metadata.Contains("version: $version")) { throw "Falsche Versionsnummer in latest.yml: $version" }
          if (-not (Test-Path "dist/LaFamilia-Setup-$version.exe")) { throw "EXE der Version $version fehlt." }

      - name: Installer and update metadata as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaFamilia-Windows-Setup-${{ github.run_number }}
          path: |
            dist/LaFamilia-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

      # Jeder erfolgreiche Windows-Build wird sofort als normales Update veröffentlicht.
      - name: Publish test build as launcher update
        shell: pwsh
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          SEPARATE_RELEASE_TOKEN: ${{ secrets.LA_FAMILIA_RELEASES_TOKEN }}
        run: |
          if (-not $env:LA_FAMILIA_UPDATES_OWNER -or -not $env:LA_FAMILIA_UPDATES_REPO) {
            throw 'Repo-Angaben für Updates fehlen. Keine Veröffentlichung.'
          }
          $targetRepo = "$env:LA_FAMILIA_UPDATES_OWNER/$env:LA_FAMILIA_UPDATES_REPO"
          if ($targetRepo -eq $env:GITHUB_REPOSITORY) {
            $env:GH_TOKEN = $env:SOURCE_GITHUB_TOKEN
            $releaseTarget = $env:GITHUB_SHA
          } elseif ($env:SEPARATE_RELEASE_TOKEN) {
            $env:GH_TOKEN = $env:SEPARATE_RELEASE_TOKEN
            $releaseTarget = 'main'
          } else {
            throw 'Für ein separates Update-Repo fehlt das Secret LA_FAMILIA_RELEASES_TOKEN.'
          }
          $actualVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$actualVersion"
          gh release view $tag --repo $targetRepo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag existiert bereits – kein Überschreiben."
          }
          $assets = @(Get-ChildItem dist -File | Where-Object {
            $_.Name -match '^LaFamilia-Setup-.*\.exe$' -or
            $_.Name -eq 'latest.yml' -or
            $_.Name -like '*.blockmap'
          } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 2 -or -not (Test-Path 'dist/latest.yml')) {
            throw 'Update-Metadaten/Setup fehlen. Kein Release ohne latest.yml.'
          }
          gh release create $tag @assets --repo $targetRepo --target $releaseTarget --title "La Familia $actualVersion" --notes "La Familia Launcher Windows Setup $actualVersion" --latest
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release $tag konnte nicht erstellt werden."
          }
