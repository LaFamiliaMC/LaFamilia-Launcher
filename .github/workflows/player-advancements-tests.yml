name: La Familia Erfolge Tests

on:
  push:
    branches:
      - feature/player-advancements
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Launcher syntax
        run: npm run check
      - name: Test Player Advancements and existing functions
        run: npm test
