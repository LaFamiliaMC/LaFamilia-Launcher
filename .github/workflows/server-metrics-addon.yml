name: La Familia Fabric 1.21.1 Server Metrics

on:
  workflow_dispatch:
  push:
    paths:
      - 'server-addon/**'
      - '.github/workflows/server-metrics-addon.yml'

permissions:
  contents: read

jobs:
  build-fabric-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Fabric server addon
        working-directory: server-addon
        run: gradle build --no-daemon
      - name: Addon als JAR bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: LaFamilia-ServerMetrics-Fabric-1.21.1
          path: server-addon/build/libs/lafamilia-servermetrics-1.0.0.jar
          if-no-files-found: error
