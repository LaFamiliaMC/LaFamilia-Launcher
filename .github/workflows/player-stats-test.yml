name: Spielerstatistiken – Launcher-Tests

on:
  push:
    branches:
      - feature/server-player-stats
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-player-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test secure player stats and existing launcher
        run: npm test
