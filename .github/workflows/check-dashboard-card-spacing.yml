name: Check La Familia Dashboard Card Spacing

on:
  push:
    branches:
      - fix/dashboard-card-content-spacing

permissions:
  contents: read

jobs:
  dashboard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run launcher and dashboard CSS tests
        run: npm test
