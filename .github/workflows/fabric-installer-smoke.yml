name: Fabric-Installer-Automatik Windows Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'fabric-auto-install.js'
      - 'tests/fabric-auto-install.test.cjs'
      - 'scripts/verify-fabric-cli.cjs'
      - '.github/workflows/fabric-installer-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Fabric unit tests
        run: node --test tests/fabric-auto-install.test.cjs
      - name: Official Fabric JAR checksum and Windows CLI installation test
        run: node scripts/verify-fabric-cli.cjs
